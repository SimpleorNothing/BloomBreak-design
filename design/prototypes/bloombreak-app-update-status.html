<main><details id="design-history" open><summary>수정이력 · v1.0.0</summary><p>2026-11-20 · D023 앱 정보: 기존 버전·빌드 표시 아래 최신 여부 한 줄 추가. 확인 중·최신·새 버전·검토 버전·확인 불가 및 다시 확인. 웹·Android 개발 소스 적용, 발행 APK·실기기·운영 배포 미확인.</p></details><h1>&lt;　앱 정보　×</h1><article><strong>BloomBreak</strong><p class="version">v 0.4.201 빌드 237</p><p class="status" role="status">최신 버전이에요.</p></article><p>아래 버튼은 상태 비교용 시안 조작부입니다.</p><nav aria-label="상태 비교"><button>최신 버전이에요.</button><button>새 버전이 있어요. 업데이트해 주세요.</button><button>최신 배포본보다 새로운 검토 버전이에요.</button><button>최신 여부를 확인할 수 없어요.</button><button>최신 버전인지 확인 중이에요.</button></nav></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.querySelector('.status').textContent=b.textContent);</script></html>
