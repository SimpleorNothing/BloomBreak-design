<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>날씨 데이터 출처 v1.0.0</title><style>*{box-sizing:border-box}body{margin:0;background:#e5eae2;color:#283d2f;font:16px system-ui,sans-serif}main{max-width:420px;margin:16px auto;background:#fffaf0;padding:20px;border-radius:24px}h1{font-size:19px}p{line-height:1.6;overflow-wrap:anywhere}button,a{display:block;width:100%;min-height:52px;padding:14px;color:inherit;background:#e5ebe2;border:0;border-radius:16px;text-align:left;font:inherit;margin:6px 0}button:focus-visible,a:focus-visible{outline:2px solid #326b52}header{display:flex;align-items:center;gap:12px}header button{width:44px;height:44px;min-height:44px;padding:0;text-align:center;background:transparent}header button:last-child{background:#fff;border-radius:50%;margin-left:auto}details{margin-bottom:20px}section[hidden]{display:none}</style>
<main><details id="design-history" open><summary>수정이력 · v1.0.0</summary><p>2026-11-23 · D009/D010/D023/D024: 시간과 날씨의 긴 출처 행 → 더보기/앱 정보의 ‘날씨 데이터 출처’와 상세 시트로 이동. 웹/Android 소스 적용, 신규 APK/IPA·실기기 미확인. 날씨 선택·LIVE 동작 유지.</p></details>
<section id="about"><header><button aria-label="상위 메뉴" type="button">&lt;</button><h1>앱 정보</h1><button aria-label="닫기" type="button">×</button></header><button type="button">이용약관　›</button><button type="button">개인정보 처리방침　›</button><button type="button">오픈소스 라이선스　›</button><button type="button" id="entry">날씨 데이터 출처　›</button><button type="button">계정 관리　›</button></section>
<section id="sources" hidden><header><button type="button" id="back" aria-label="앱 정보로 돌아가기">&lt;</button><h1>날씨 데이터 출처</h1><button type="button" id="close" aria-label="닫기">×</button></header><p>LIVE 날씨 데이터는 Open-Meteo에서 제공해요.</p><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a><a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a><p>날씨 데이터를 앱의 시간·날씨 및 풍경 효과로 변환해 사용합니다.</p></section></main><script>const about=document.querySelector('#about'),sources=document.querySelector('#sources'),entry=document.querySelector('#entry');entry.onclick=()=>{about.hidden=true;sources.hidden=false;document.querySelector('#back').focus()};const back=()=>{sources.hidden=true;about.hidden=false;entry.focus()};document.querySelector('#back').onclick=back;document.querySelector('#close').onclick=()=>{sources.hidden=true;about.hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sources.hidden)back()});</script></html>
