<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꾸미기 소품 위치·크기 조정 · v1.0.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ed;color:#283d2f;font:14px/1.6 system-ui}details{max-width:430px;margin:16px auto;padding:16px;background:white}main{max-width:430px;margin:auto;background:#fffaf0;border-radius:24px;padding:20px}h1{font-size:19px;margin:0}p{color:#68766b}button{font:600 14px/1.5 system-ui;border:0;border-radius:12px;min-height:48px;color:#47765b;background:#e6ece3;cursor:pointer}.tabs,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs{grid-template-columns:1fr 1fr;padding:4px;background:#e6ece3;border-radius:16px;margin-bottom:20px}.tabs button[aria-pressed=true]{background:white}.grid button{min-height:80px}.entry,.done{width:100%;margin-top:12px}.done{min-height:56px;background:#47765b;color:white}.hint{font-size:12.5px;margin:10px 2px}.selected{outline:2px solid #47765b}#editor{padding:20px;border-radius:16px;background:#e6ece3}input{width:100%}button:disabled{opacity:.5}</style>
<details id="design-history" open><summary>수정이력 · v1.0.0 · 2026-11-20</summary><p>D007/D008 · #891 후속. 소품 탭의 조정 버튼 없음 → 액자와 같은 위치·크기 조정 버튼 및 안내 추가. 소품 선택 전 비활성화, 선택 후 기존 편집기로 이동. 기존 취소·저장 유지. 웹·Android 소스 반영, 발행 APK·실기기 미확인.</p></details>
<main><h1>꾸미기</h1><p>작은 소품과 액자로 공간을 꾸며요.</p><div class="tabs"><button aria-pressed="true" id="props">소품</button><button aria-pressed="false" id="frame">액자</button></div><section id="choices"><h3 id="heading">기본 소품</h3><div class="grid" id="items"></div><button class="entry" id="position" disabled><span aria-hidden="true">✥</span> 위치·크기 조정</button><p class="hint" id="hint">소품을 고른 뒤 위치와 크기를 조정해 보세요.</p><button class="done" id="done">이대로 꾸밀게요</button></section><section id="editor" hidden><h3>위치·크기 조정</h3><p>기존 편집기로 이어지는 동작 예시입니다.</p><label>좌우 위치<input type="range"></label><label>상하 위치<input type="range"></label><label>크기<input type="range"></label><button id="cancel">취소</button> <button id="save">이대로 둘게요</button></section><p role="status" id="status"></p></main>
<script>let tab='props';const q=s=>document.querySelector(s);function render(){q('#items').replaceChildren();for(const text of tab==='props'?['찻잔','도자기 새','조약돌 무드등']:['원목','오크','블랙','골드','아이보리','원목 매트']){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{q('#items').querySelectorAll('button').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');q('#position').disabled=false};q('#items').append(b)}q('#position').disabled=true;q('#heading').textContent=tab==='props'?'기본 소품':'액자 색상';q('#hint').textContent=tab==='props'?'소품을 고른 뒤 위치와 크기를 조정해 보세요.':'정원에서 액자를 길게 눌러도 조정할 수 있어요.';for(const t of ['props','frame'])q('#'+t).setAttribute('aria-pressed',String(t===tab))}for(const t of ['props','frame'])q('#'+t).onclick=()=>{tab=t;render()};q('#position').onclick=()=>{q('#choices').hidden=true;q('#editor').hidden=false};for(const a of ['cancel','save'])q('#'+a).onclick=()=>{q('#choices').hidden=false;q('#editor').hidden=true;q('#status').textContent=a==='save'?'배치 예시를 저장했어요.':'변경을 취소했어요.'};q('#done').onclick=()=>q('#status').textContent='꾸미기를 마쳤어요.';render();</script></html>
