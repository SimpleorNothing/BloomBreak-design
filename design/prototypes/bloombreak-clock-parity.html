<h1>혼자 꽃멍 · 함께 보기 시계</h1><details id="design-history" open><summary>수정 이력 · v1.0.0 · 2026-11-19</summary><p>D028 / #878 후속. 혼자 꽃멍의 최대 48px 시계와 14px 날짜·쉼 시간을 함께 보기 기준인 26px 시계·12px 보조 문구로 변경. 기본 상단 위치도 안전영역 아래 72px에서 99px로 통일한다. 기존 날짜·이번 쉼/함께 본 시간 문구와 숨김 동작은 유지한다. 이 시안은 기존 v12.2.10의 D028 시계 크기·기본 위치보다 우선한다. 웹·Android 개발 소스 반영, 발행 APK·실기기 미확인. 배경은 배치 확인용이다.</p></details>
