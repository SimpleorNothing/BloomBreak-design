<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>꽃멍 최종 성장 · v1.0.0</title>
<style>body{margin:24px;background:#edf0e9;color:#26362b;font-family:system-ui,sans-serif;line-height:1.6}details{max-width:850px}.screens{display:flex;flex-wrap:wrap;gap:24px}figure{margin:0}.phone{box-sizing:border-box;position:relative;width:360px;height:640px;background:linear-gradient(#526875,#aeac98 60%,#675949);color:white;text-align:center;padding:30px 20px}.clock{font-size:26px;margin-top:65px}.clock small{display:block;font-size:12px}.flower{font-size:100px;margin-top:130px}.bottom{position:absolute;bottom:26px;left:20px;right:20px}.line{opacity:0;transition:opacity 1s;font-size:16px}.line.shown{opacity:1}.growth{font-size:13px}.bar{height:4px;background:#ffffff44}.bar i{display:block;height:100%;width:75%;background:#fff}button{padding:12px;border:0;border-radius:12px;margin:12px 0}</style>
<h1>꽃멍 · 최종 성장 후 감상</h1>
<details open id="design-history"><summary>수정 이력 · v1.0.0 · 2026-11-26</summary><p>D028 / #878 후속. 성장 중에는 안내와 진행 바 유지. 개화 후 꽃과 잎의 풍성함 성장까지 완료하면 두 요소를 숨긴다. 감성 글귀는 8초간 표시하고 60~120초 쉬었다 다시 표시한다. 꽃멍 시간 기록과 기능은 유지한다. 한글·영문, Android·iPhone 공통 기준. 개발 소스·Node 검사 반영이며 신규 설치본·실기기 확인 전. 배경은 배치 확인용이다.</p></details>
<button id="language">English</button>
<div class="screens"><figure><figcaption data-ko="성장 중" data-en="Growing">성장 중</figcaption><div class="phone"><div class="clock">20:20<small data-ko="이번 쉼 9분 15초" data-en="This break 9 min 15 sec">이번 쉼 9분 15초</small></div><div class="flower" aria-hidden="true">🌼</div><div class="bottom"><p class="line" data-ko="오늘도 잘 쉬고 있어요" data-en="A quiet moment for you">오늘도 잘 쉬고 있어요</p><div class="growth"><p data-ko="꽃과 잎이 더 풍성해지고 있어요 · 75%" data-en="Growing more flowers and leaves · 75%">꽃과 잎이 더 풍성해지고 있어요 · 75%</p><div class="bar"><i></i></div></div></div></div></figure>
<figure><figcaption data-ko="최종 성장 완료" data-en="Fully grown">최종 성장 완료</figcaption><div class="phone"><div class="clock">20:20<small data-ko="이번 쉼 9분 15초" data-en="This break 9 min 15 sec">이번 쉼 9분 15초</small></div><div class="flower" aria-hidden="true">🌼</div><div class="bottom"><p class="line" data-ko="오늘도 잘 쉬고 있어요" data-en="A quiet moment for you">오늘도 잘 쉬고 있어요</p></div></div></figure></div>
<script>let en=false;document.querySelector('#language').onclick=()=>{en=!en;document.documentElement.lang=en?'en':'ko';document.querySelectorAll('[data-ko]').forEach(e=>e.textContent=e.dataset[en?'en':'ko']);document.querySelector('#language').textContent=en?'한국어':'English'};function phrase(){document.querySelectorAll('.line').forEach(e=>e.classList.add('shown'));setTimeout(()=>document.querySelectorAll('.line').forEach(e=>e.classList.remove('shown')),8000);setTimeout(phrase,68000+Math.random()*60000)}setTimeout(phrase,6000);</script></html>
